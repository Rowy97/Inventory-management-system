{% extends "base.html" %}

{% block title %}新增采购单{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1 class="mt-4">新增采购单</h1>
    <form method="GET" action="{{ url_for('download_purchase') }}" class="form-inline">
        <label for="start_date">开始日期:</label>
        <input type="date" name="start_date" id="start_date" class="form-control mx-2" required>
      
        <label for="end_date">结束日期:</label>
        <input type="date" name="end_date" id="end_date" class="form-control mx-2" required>
      
        <button type="submit" class="btn btn-secondary ml-2">导出采购订单</button>
      </form>
    <form action="{{ url_for('purchase_order') }}" method="POST">
        <!-- Purchase Information -->
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="purchase_date">采购日期</label>
                    <input type="date" class="form-control" id="purchase_date" name="purchase_date" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="supplier">供应商</label>
                    <input type="text" class="form-control" id="supplier" name="supplier" required>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="invoice">发票号</label>
                    <input type="text" class="form-control" id="invoice" name="invoice" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="pay_way">支付方式</label>
                    <input type="text" class="form-control" id="pay_way" name="pay_way" required>
                </div>
            </div>
        </div>
         <!-- User Info -->
         <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="user_name">操作员</label>
                    <input type="text" class="form-control" id="user_name" name="user_name" value="{{ current_user.username }}" readonly>
                </div>
            </div>
        </div>

        <!-- Grand Total Price Block -->


        <!-- Purchase Order Information -->
        <hr>
        <h4>采购单明细</h4>
        <button type="button" id="add_product" class="btn btn-info mb-3">添加更多产品</button>
        <div id="purchase_order_items">
            <div class="row font-weight-bold">
                <div class="col-md-2">产品SKU</div>
                <div class="col-md-2">产品名称</div>
                <div class="col-md-2">单价</div>
                <div class="col-md-1">数量</div>
                <div class="col-md-1">运费</div>
                <div class="col-md-2">总价</div>
                <div class="col-md-2">操作</div>
            </div>
            <!-- Datalist for products -->
        <datalist id="product_list">
            {% for product in products %}
            <option value="{{ product[0] }}" data-sku="{{ product[1] }}"></option>
            {% endfor %}
    </datalist>
            <div class="purchase_order_item row">
                <div class="col-md-2">
                    <input type="text" class="form-control product-sku" name="product_sku[]" readonly required>
                </div>
                <div class="col-md-2">
                    <input type="text"
                           class="form-control product-name-input"
                           name="product_name[]"
                           list="product_list"
                           placeholder="输入产品名称"
                           oninput="updateSkuFromName(this)"
                           required>
                
                    <!-- Hidden SKU field -->
                    
                </div>
                <div class="col-md-2"><input type="number"  class="form-control unit-price" name="unit_price[]" required step=0.01 inputmode="decimal"></div>
                <div class="col-md-1"><input type="number" class="form-control quantity" name="quantity[]" min="1" required></div>
                <div class="col-md-1"><input type="number"  class="form-control delivery-fee" name="delivery_fee[]" value="0" required step=0.01></div>
                <div class="col-md-2"><input type="number" class="form-control total-price" name="total_price[]" required step=0.01></div>

                <div class="col-md-2">
                    <button type="button" class="btn btn-danger delete-product">删除</button>
                </div>
            </div>
        </div>
        <hr>
        <h3>总计</h3>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="grand_total">总价格</label>
                    <input type="number" step="0.01" class="form-control" id="grand_total" name="grand_total" readonly>
                </div>
            </div>
        </div>
        <!-- Submit Button -->

            <button type="submit" class="btn btn-primary mt-3">提交采购单</button>
            <a href="{{ url_for('view_purchase') }}" class="btn btn-secondary mt-3 ml-2">
                查看历史采购表
            </a>
            <a href="{{ url_for('download_purchase') }}" class="btn btn-secondary mt-3 ml-2">导出采购订单</a>
            

    </form>
</div>
<style>
    /* Hide spinner for Chrome, Safari, Edge, Opera */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    
    /* Hide spinner for Firefox */
    input[type=number] {
        -moz-appearance: textfield;
    }
    </style>
    
<!-- JavaScript for Dynamic Product Selection, Auto-fill SKU, Auto-Calculate Total Price, and Grand Total -->
<script>
function updateSkuFromName(input) {
    const value = input.value;
    const datalistOptions = document.querySelectorAll('#product_list option');
    let matchedSku = "";

    datalistOptions.forEach(option => {
        if (option.value === value) {
            matchedSku = option.getAttribute('data-sku');
        }
    });

    // Find the closest .purchase_order_item (the full row), then locate its .product-sku input
    const row = input.closest('.purchase_order_item');
    const skuInput = row.querySelector('.product-sku');

    if (skuInput) {
        skuInput.value = matchedSku;
    }
}


    document.addEventListener("DOMContentLoaded", function() {
        function updateSKU(selectElement) {
            let selectedOption = selectElement.options[selectElement.selectedIndex];
            let skuInput = selectElement.closest(".purchase_order_item").querySelector(".product-sku");
            skuInput.value = selectedOption.getAttribute("data-sku");
        }

        function calculateTotalPrice(row) {
            let quantity = parseFloat(row.querySelector(".quantity").value) || 0;
            let unitPrice = parseFloat(row.querySelector(".unit-price").value) || 0;
            let deliveryFee = parseFloat(row.querySelector(".delivery-fee").value) || 0;
            let totalPrice = quantity * unitPrice + deliveryFee;
            row.querySelector(".total-price").value = totalPrice.toFixed(2);
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let grandTotal = 0;
            document.querySelectorAll(".total-price").forEach(input => {
                grandTotal += parseFloat(input.value) || 0;
            });
            document.getElementById("grand_total").value = grandTotal.toFixed(2);
        }

        document.getElementById('purchase_order_items').addEventListener('change', function(event) {
            let target = event.target;
            if (target.classList.contains("product-select")) {
                updateSKU(target);
            }
        });

        document.getElementById('purchase_order_items').addEventListener('input', function(event) {
            let target = event.target;
            if (target.classList.contains("quantity") || target.classList.contains("unit-price") || target.classList.contains("delivery-fee")) {
                calculateTotalPrice(target.closest(".purchase_order_item"));
            }
        });

        document.getElementById('add_product').addEventListener('click', function() {
            let newProductItem = document.createElement('div');
            newProductItem.classList.add('purchase_order_item', 'row', 'mt-2');
            newProductItem.innerHTML = `
                <div class="col-md-2">
                    <input type="text" class="form-control product-sku" name="product_sku[]" readonly required>
                </div>
                <div class="col-md-2">
                    <input type="text"
                           class="form-control product-name-input"
                           name="product_name[]"
                           list="product_list"
                           placeholder="输入产品名称"
                           oninput="updateSkuFromName(this)"
                           required>
                
                    <!-- Hidden SKU field -->
                    
                </div>
                <div class="col-md-2"><input type="number"  class="form-control unit-price" name="unit_price[]" required step=0.01></div>
                <div class="col-md-1"><input type="number" class="form-control quantity" name="quantity[]" min="1" required> </div>
                <div class="col-md-1"><input type="number"  class="form-control delivery-fee" name="delivery_fee[]" value="0" required step=0.01></div>
                <div class="col-md-2"><input type="number" class="form-control total-price" name="total_price[]" required step=0.01></div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-danger delete-product">删除</button>
                </div>
                `;

            document.getElementById('purchase_order_items').appendChild(newProductItem);
        });
        // Delete product row
        document.getElementById('purchase_order_items').addEventListener('click', function(event) {
            if (event.target.classList.contains("delete-product")) {
                let row = event.target.closest(".purchase_order_item");
                row.remove();
                updateGrandTotal(); // Update the grand total after deletion
            }
        });
    });
</script>
{% endblock %}
